name: 'default'
record_video: -1 # Example: 100 to record every 100 episodes
params:
  # --- RL Hyperparameters ---
  model: 'DQN' # 'DQN' or 'DDQN'
  num_episodes: 5000
  gamma: 0.99
  learning_rate: 0.0001
  batch_size: 64
  mem_len: 50000
  step_update: 4       # Env steps per training update
  target_update: 1000  # Training steps per target network update

  # --- Exploration ---
  epsilon: 1.0         # Starting epsilon
  epsilon_final: 0.02  # Final epsilon value
  episode_decay: 3000  # Episodes over which epsilon decays linearly

  # --- Environment/Episode Control ---
  start_skip: 30       # Initial env steps to skip in episode (no training/storage)
  stacked_neg: 150     # Terminate early after N consecutive negative rewards (-1 to disable)
  random_seed: 42      # -1 for no fixed seed

  # --- Network/Optimization ---
  optimizer: 'AdamW'   # 'Adam', 'AdamW', 'RMSprop'
  loss: 'Huber'        # 'MSE', 'Huber'

  # --- Cost Penalty (Simplified CMDP-like) ---
  use_cost_penalty: False             # Set to True via menu choice 3
  cost_reward_threshold: -0.1         # Reward below this incurs cost
  cost_penalty_coefficient: 1.0       # Multiplier for the cost penalty

  # --- Notes ---
  notes: "Default settings, potentially overridden by main.py menu choices."
